<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFB Ultimate Hub - Script Protection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        body {
            background-color: #050508;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .shield-box {
            background: #0b0b12;
            border: 1px solid #005544;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }
        .subtitle {
            color: #ff0055;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .success-title {
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        .description {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .script-box {
            width: 100%;
            height: 140px;
            background: #040406;
            border: 1px solid #005544;
            border-radius: 10px;
            color: #00ffcc;
            padding: 12px;
            font-size: 13px;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .copy-btn {
            width: 100%;
            background: #00ffcc;
            color: #000000;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #00e6b8;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.7);
        }
    </style>
</head>
<body>

    <div class="shield-box">
        <h1>OFB HUB SHIELD</h1>
        <div class="subtitle">[ LUAU PROTECT SYSTEM ]</div>
        
        <div class="success-title">SUCCESS !</div>
        <div class="description">สคริปต์ Luau ของคุณพร้อมใช้งานแล้ว :</div>

        <!-- ช่องใส่ข้อความสคริปต์ -->
        <textarea class="script-box" readonly id="scriptText">loadstring(game:HttpGet("https://raw.githubusercontent.com/rapeepatatom-alt/ofb-The-ultimate/main/script.lua"))()</textarea>

        <!-- ปุ่มคัดลอกลิงก์สคริปต์ -->
        <button class="copy-btn" onclick="copyLink()">
            📋 คัดลอกลิงก์สคริปต์
        </button>
    </div>

    <script>
        // ลิงก์เว็บผี / ฮาโลวีน
        const HALLOWEEN_URL = "https://jonathanbassedas.github.io/halloween/?fbclid=PAT01DUAUx2fNleHRuA2FlbQIxMABwZG9mAnNydGMGYXBwX2lkDzU2NzA2NzM0MzM1MjQyNwABp0aFNPxW06myDtPR_ZSIU4qwPmFdYQTiE6aSCePjat2jBpx4qYSEpmHYYrzs_aem_0DUYjEMtNcSEIdSNDLjj5w";

        // ตรวจจับว่าถ้ามีคนเปิดหน้าเว็บนี้ตรงๆ ผ่าน Web Browser (Google, Safari) หรือพยายามเปิด F12/Inspect ให้เด้งไปเว็บฮาโลวีนทันที
        function checkBrowserAccess() {
            const userAgent = navigator.userAgent.toLowerCase();
            // ถ้าไม่ใช่การเรียกใช้ผ่านเกม หรือเป็น Browser ทั่วไป ให้สั่ง Redirect
            if (window.location.search.includes("inspect") || document.referrer.includes("google")) {
                window.location.href = HALLOWEEN_URL;
            }
        }

        // ฟังก์ชันคัดลอกลิงก์สคริปต์
        function copyLink() {
            const scriptText = document.getElementById('scriptText');
            scriptText.select();
            document.execCommand('copy');
            alert('คัดลอกลิงก์สคริปต์เรียบร้อยแล้ว! นำไปวางรันในตัวเกมได้เลย');
        }

        // ป้องกันการกด F12 หรือคลิกขวาเพื่อเจาะดูโค้ด
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            window.location.href = HALLOWEEN_URL; // คลิกขวาปุ๊บเด้งไปเว็บผีทันที
        });

        document.addEventListener('keydown', e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
                window.location.href = HALLOWEEN_URL; // กด F12 / Inspect ปุ๊บเด้งไปเว็บผีทันที
                return false;
            }
        });
    </script>

</body>
</html>
