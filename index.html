<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFB Hub - Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background: #1a1a24;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #2a2a3d;
            z-index: 10;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #00ffcc;
        }
        .brand-subtitle {
            font-size: 12px;
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        p {
            font-size: 14px;
            color: #a0a0b0;
            margin-bottom: 20px;
        }
        .box {
            display: none;
        }
        .active {
            display: block;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #12121a;
            border: 1px solid #33334d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }
        input:focus {
            border-color: #00ffcc;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        button:hover {
            background: #00b386;
        }
        .secondary-btn {
            background: #33334d;
            color: #fff;
        }
        .secondary-btn:hover {
            background: #44445c;
        }
        .status {
            font-size: 13px;
            margin-top: 10px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #12121a;
            border: 1px solid #33334d;
            border-radius: 8px;
            color: #00ffcc;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            margin-bottom: 10px;
        }
        .script-label {
            font-size: 12px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* หน้าจอนิ้วกลางดักบอท */
        #bot-banned-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff4d4d;
        }
        .middle-finger {
            font-size: 120px;
            margin-bottom: 20px;
            animation: bounce 0.3s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        /* หน้าจอผีหลอน */
        #jumpscare-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99998;
            justify-content: center;
            align-items: center;
        }
        #jumpscare-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- หน้าจอนิ้วกลาง -->
    <div id="bot-banned-screen">
        <div class="middle-finger">🖕</div>
        <h1 style="color: #ff4d4d; font-size: 26px;">GET OUT!</h1>
        <p style="color: #fff; margin-top: 10px;">ตรวจพบความพยายามที่ไม่ถูกต้อง</p>
    </div>

    <!-- หน้าจอผีหลอน -->
    <div id="jumpscare-screen">
        <img src="https://i.imgur.com/39aU444.jpg" alt="Scare">
    </div>

    <!-- เสียงสำรอง -->
    <audio id="scream-audio" preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73180.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="main-container">
        <!-- หน้ายืนยันตัวตน -->
        <div id="step-verify" class="active">
            <h1>🛡️ Security Gate</h1>
            <div class="brand-subtitle">[ OFB SYSTEM ]</div>
            <p>กรุณายืนยันตัวตนเพื่อเข้าใช้งานระบบ</p>
            <div style="font-size: 40px; margin-bottom: 15px;">🔒</div>
            <button onclick="passVerification()">เข้าสู่หน้ากรอก Key</button>
            <div id="security-log" class="status" style="color: #ff4d4d;"></div>
        </div>

        <!-- หน้ากรอก Key -->
        <div id="step-key" class="box">
            <h1>🔑 Key System</h1>
            <div class="brand-subtitle">[ OFB SYSTEM ]</div>
            <p>กรุณากรอก Key เพื่อเข้าถึงสคริปต์</p>
            <input type="text" id="key-input" placeholder="ใส่ Key ของคุณที่นี่...">
            <button onclick="verifyKey()">ตรวจสอบ Key</button>
            <button class="secondary-btn" onclick="getKeyRedirect()">รับ Key (Get Key)</button>
            <div id="key-status" class="status"></div>
        </div>

        <!-- หน้าสคริปต์จริง (ช่องใส่สคริปต์ย่อ/กำหนดเอง) -->
        <div id="step-script" class="box">
            <h1>🚀 OFB Script Hub</h1>
            <div class="brand-subtitle">[ OFB SYSTEM ]</div>
            <p>ยืนยันตัวตนสำเร็จ!</p>
            
            <div class="script-label">📌 ใส่หรือแก้ไขสคริปต์ของคุณที่นี่:</div>
            <textarea id="script-box">loadstring(game:HttpGet("https://raw.githubusercontent.com/rapeepatatom-alt/ofb-The-ultimate/main/script.lua"))()</textarea>
            
            <button onclick="copyScript()">คัดลอกสคริปต์ (Copy Script)</button>
        </div>
    </div>

    <script>
        let audioCtx;
        function playScreamSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(3000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch(e) {}

            const audio = document.getElementById('scream-audio');
            if(audio) {
                audio.currentTime = 0;
                audio.volume = 1.0;
                audio.play().catch(e => console.log(e));
            }
        }

        function triggerScareAndBan(type = 'ghost') {
            playScreamSound();
            if (navigator.vibrate) {
                navigator.vibrate([500, 100, 500, 100, 500]);
            }
            if (type === 'ghost') {
                document.getElementById('jumpscare-screen').style.display = 'flex';
            } else {
                document.getElementById('bot-banned-screen').style.display = 'flex';
            }
        }

        if (navigator.webdriver) {
            triggerScareAndBan('finger');
        }

        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            triggerScareAndBan('ghost');
        });
        
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                triggerScareAndBan('ghost');
            }
        });

        function passVerification() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if(navigator.webdriver) {
                triggerScareAndBan('finger');
                return;
            }
            document.getElementById('step-verify').classList.remove('active');
            document.getElementById('step-key').classList.add('active');
        }

        const CORRECT_KEY = "OFB-VIP-2026"; 
        let wrongAttempts = 0;

        function verifyKey() {
            const userKey = document.getElementById('key-input').value.trim();
            const status = document.getElementById('key-status');
            
            if(userKey === CORRECT_KEY) {
                status.style.color = "#00ffcc";
                status.innerText = "✅ คีย์ถูกต้อง! กำลังปลดล็อกระบบ...";
                setTimeout(() => {
                    document.getElementById('step-key').classList.remove('active');
                    document.getElementById('step-script').classList.add('active');
                }, 1000);
            } else {
                wrongAttempts++;
                if (wrongAttempts >= 2) {
                    triggerScareAndBan('ghost');
                } else {
                    status.style.color = "#ff4d4d";
                    status.innerText = `❌ คีย์ไม่ถูกต้อง! (เตือนครั้งที่ ${wrongAttempts}/2)`;
                }
            }
        }

        function getKeyRedirect() {
            window.location.href = "https://linkvertise.com"; 
        }

        function copyScript() {
            const copyText = document.getElementById("script-box");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("📋 คัดลอกสคริปต์สำเร็จ!");
        }
    </script>
</body>
</html>
