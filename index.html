<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFB Ultimate Hub - Script Protection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        body {
            background-color: #0a0a0f;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }
        .shield-box {
            background: #12121c;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .status {
            color: #ffaa00;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .info-box {
            background: #1a1a26;
            border: 1px dashed #00ffcc;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.6;
        }
        .middle-finger {
            font-size: 90px;
            margin: 15px 0;
            animation: pulse 0.8s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        .warning-text {
            color: #ff0055;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }
        .script-locked {
            background: #0d0d14;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="shield-box" id="mainCard">
        <h1>OFB HUB SHIELD</h1>
        <div class="status">[ LUAU PROTECT SYSTEM ]</div>
        
        <div class="info-box" id="userInfo">
            กำลังตรวจสอบอุปกรณ์และความปลอดภัย...
        </div>

        <div class="script-locked">
            🔒 สคริปต์ถูกปิดล็อกถาวร<br>
            ไม่อนุญาตให้คัดลอกหรือเข้าถึงผ่านระบบภายนอก!
        </div>
    </div>

    <script>
        // เช็กว่าเป็น บอท / Crawler / สคริปต์เจาะ หรือไม่
        function isBotOrScraper() {
            const ua = navigator.userAgent.toLowerCase();
            const botKeywords = [
                'bot', 'spider', 'crawler', 'python', 'curl', 'wget', 
                'httpclient', 'headless', 'phantomjs', 'selenium', 'puppeteer', 'axios'
            ];
            
            // เช็กจาก User-Agent
            for (let keyword of botKeywords) {
                if (ua.includes(keyword)) return true;
            }
            // เช็กคุณสมบัติบอท Headless
            if (navigator.webdriver) return true;
            return false;
        }

        // ฟังก์ชันแสดงหน้านิ้วกลาง (สำหรับบอท/ผู้บุกรุก)
        function triggerMiddleFinger(reason) {
            document.getElementById('mainCard').style.borderColor = '#ff0055';
            document.getElementById('mainCard').style.boxShadow = '0 0 30px rgba(255, 0, 85, 0.6)';
            document.getElementById('mainCard').innerHTML = `
                <h1 style="color: #ff0055;">BOT DETECTED!</h1>
                <div class="status" style="color: #ff0055;">[ SECURITY VIOLATION ]</div>
                <div class="middle-finger">🖕</div>
                <div class="warning-text">
                    คิดจะเจาะสคริปต์เหรอไอตัวจ้ำสแกดเด้ย!<br>
                    (${reason})
                </div>
            `;
        }

        // ดึง IP + รุ่นมือถือโชว์
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const ip = data.ip;
                const ua = navigator.userAgent;
                let device = "PC / Unknown";
                
                if (/android/i.test(ua)) device = "Android Device";
                else if (/iphone|ipad|ipod/i.test(ua)) device = "iOS Device";
                else if (/windows/i.test(ua)) device = "Windows PC";

                document.getElementById('userInfo').innerHTML = 
                    `🌐 <b>IP Address:</b> ${ip}<br>📱 <b>Device:</b> ${device}<br>🛡️ <b>Status:</b> Verified Normal User`;
            })
            .catch(() => {
                document.getElementById('userInfo').innerHTML = 
                    `🌐 <b>IP Address:</b> Hidden/Protected<br>📱 <b>Device:</b> Web Browser<br>🛡️ <b>Status:</b> Verified Normal User`;
            });

        // ถ้าระบบตรวจเจอว่าเป็นบอท โชว์นิ้วกลางทันที!
        if (isBotOrScraper()) {
            triggerMiddleFinger("Detected Bot/Automated Tool");
        }

        // ถ้าพยายามกด F12 / Inspect / คลิกขวา เพื่อเจาะซอร์สโค้ด -> โชว์นิ้วกลางทันที!
        document.addEventListener('contextmenu', event => {
            event.preventDefault();
            triggerMiddleFinger("Attempted Right-Click / Inspect");
        });

        document.addEventListener('keydown', event => {
            // ดักจับ F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (event.keyCode == 123 || 
               (event.ctrlKey && event.shiftKey && (event.keyCode == 73 || event.keyCode == 74)) || 
               (event.ctrlKey && event.keyCode == 85)) {
                event.preventDefault();
                triggerMiddleFinger("Attempted DevTools / Source Inspection");
                return false;
            }
        });
    </script>

</body>
</html>
