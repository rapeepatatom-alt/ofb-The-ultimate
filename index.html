<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFB Ultimate Hub - Security Protocol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        body {
            background-color: #0a0a0f;
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }
        .shield-box {
            background: #12121c;
            border: 2px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #ff0055;
            font-size: 22px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }
        .status {
            color: #ff3366;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .info-box {
            background: #1a1a26;
            border: 1px dashed #ff0055;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #ff99bb;
            margin-bottom: 20px;
            text-align: left;
        }
        .middle-finger {
            font-size: 80px;
            margin: 15px 0;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        .warning-text {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="shield-box">
        <h1>OFB HUB SHIELD</h1>
        <div class="status">[ SECURITY LOCKDOWN ACTIVE ]</div>
        
        <div class="info-box" id="userInfo">
            กำลังตรวจสอบความปลอดภัยระบบ...
        </div>

        <div class="middle-finger">🖕</div>
        
        <div class="warning-text">
            ตรวจพบความพยายามเจาะระบบ!<br>
            สคริปต์ถูกปิดตายถาวร ห้ามคัดลอกหรือเอาไปเด็ดขาด!ไอตัวจ้ำสแกดเด้ย
        </div>
    </div>

    <script>
        // ดึงข้อมูล IP และรุ่นมือถือผู้บุกรุกมาโชว์ประจาน
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const ip = data.ip;
                const ua = navigator.userAgent;
                let device = "Unknown Device";
                
                if (/android/i.test(ua)) device = "Android Device";
                else if (/iphone/i.test(ua)) device = "iPhone";
                else if (/windows/i.test(ua)) device = "Windows PC";

                document.getElementById('userInfo').innerHTML = 
                    `⚠️ <b>Detected IP:</b> ${ip}<br>📱 <b>Device:</b> ${device}<br>❌ <b>Status:</b> Access Denied!`;
            })
            .catch(error => {
                document.getElementById('userInfo').innerHTML = 
                    `⚠️ <b>Detected IP:</b> 127.0.0.1<br>📱 <b>Device:</b> Mobile/Web Crawler<br>❌ <b>Status:</b> Access Denied!`;
            });

        // ล็อกไม่ให้คลิกขวาและกด F12 ป้องกันการแอบส่อง
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.keyCode == 123 || (event.ctrlKey && event.shiftKey && (event.keyCode == 73 || event.keyCode == 74)) || (event.ctrlKey && event.keyCode == 85)) {
                event.preventDefault();
                return false;
            }
        });
    </script>

</body>
</html>
